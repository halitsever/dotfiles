name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck has no zsh support, so check syntax with zsh itself.
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: zsh -n .zshrc
